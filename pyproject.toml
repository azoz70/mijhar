[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mijhar"
description = "MIJHAR — Configuration Security & Compliance Auditing Framework. See What Others Miss."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdulaziz Alshehri" }]
keywords = ["security", "audit", "compliance", "grc", "cis", "nca-ecc", "sama-csf", "iso27001", "hardening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.9,<1",
    "rich>=13,<16",
    "PyYAML>=6",
    "Jinja2>=3",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mijhar = "mijhar.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mijhar.rules" = ["data/*/*.yaml"]
"mijhar.compliance" = ["data/*/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "mijhar.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
