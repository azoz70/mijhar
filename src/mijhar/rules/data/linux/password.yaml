# MIJHAR Linux password policy rules.
- id: PASS-001
  title: Password maximum age is within policy
  description: Passwords should expire periodically (typically 90 days or fewer).
  severity: low
  platforms: [linux]
  technical_impact: Long-lived passwords increase the window for credential compromise.
  security_impact: Stale credentials remain valid longer than policy allows.
  remediation: Set PASS_MAX_DAYS to 90 or lower in /etc/login.defs.
  references:
    cis: ["5.4.1.1"]
  check:
    fact: password.max_days
    operator: less_than_or_equal
    value: 90
    fail_status: warning
