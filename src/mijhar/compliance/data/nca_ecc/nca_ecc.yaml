  - id: 4-2-4
    title: 'Cloud computing and hosting services shall be periodically reviewed. Appendices Appendix (A): Ter...'
    description: 'Cybersecurity requirements for cloud computing and hosting services shall be periodically reviewed. Appendices Appendix (A): Terms and Definitions Table (2) below highlights some of the
      terms and their definitions which were used in this document. TABLE 2 TERMS AND DEFINITION Term Definition Advanced Persistent Threats (APT) Protection Protection against advanced threats that use
      invisible techniques to gain unauthorized access to technology systems and networks and stay as long as possible by circumventing detection and protection tools. To accomplish this, zero-day malware
      are usually used in these techniques. Asset Any tangible or intangible thing of value to the entity. There are many types of assets, and some of which are obvious, such as persons, machinery, facilities,
      patents, software, and services. The term could also include less obvious things, such as information and characteristics (such as the entity’s reputation and public image, as well as skills and knowledge).
      Attack Any kind of malicious activity aimed at gaining unauthorized access to, collecting, disabling, preventing, destroying, or sabotaging information system resources or the information itself.
      Audit Independent review and examination of records and activities, in order to assess the effectiveness of cybersecurity controls and to ensure compliance with policies, operational procedures, standards,
      and relevant legislative and regulatory requirements. Authentication Verification of the user''s identity, process, or device, which is often a prerequisite for allowing access to resources on the
      system. Authorization The property of identifying and verifying the rights/licenses of the user to access the information and technology assets and resources of the entity and allowing access based
      on the user’s rights/licenses previously defined. Availability  Ensuring timely access and use of information, data, systems, and applications. Backup  Files, devices, data, and procedures available
      for use in case of failure or loss, or in case of deletion or suspension of their original copies. Bring Your Own Device (BYOD) This term refers to an entity''s policy that allows (in whole or in
      part) its personnel to bring their personal devices (laptops, tablets, and smartphones) to their workplace within the entity and use such devices to access the entity’s networks, information, applications,
      and systems to which access is restricted. Change Management A service management system that ensures a systematic and proactive approach using effective standard methods and procedures (for example,
      change in the entity’s infrastructure and networks, etc.). Change management helps all stakeholders, including individuals and teams alike, move from their current state to the next desired state.
      It also helps reduce the impact of relevant incidents on service. Closed-Circuit Television (CCTV) CCTV, also known as video surveillance, uses video cameras to transmit a signal to a specific location
      on a limited set of screens.  This term is often used to refer to the surveillance technique employed in areas that require monitoring due to the importance of physical security. Cloud Computing A
      model to enable on-demand access to a shared pool of information technology resources (e.g. networks, servers, storage, applications, and services) that can be rapidly provided and launched with minimal
      operational management effort and service setup intervention/interaction from the service provider. Cloud computing allows users to access technology-based services over a cloud computing network
      without needing to know or control the technology infrastructure that supports them. Cloud computing models are composed of five essential characteristics: on-demand self-service, broad network access,
      resource pooling, rapid elasticity, and measured service. There are three models of cloud computing services: Software as a Service (SaaS), Platform as a Service (PaaS), and Infrastructure as a Service
      (IaaS). Moreover, according to the nature of access, there are four cloud computing models: Public Cloud Computing, Community Cloud Computing, Private Cloud Computing, and Hybrid Cloud Computing.
      Compromise Disclosure or acquisition of information not authorized to be leaked to or obtained by third parties, or violation of the entity''s cybersecurity policy through the disclosure, alteration,
      sabotage, or loss of anything, either intentionally or unintentionally. Compromise also means the disclosure, acquisition, leakage, alteration, or use of sensitive data without authorization (including
      cryptographic keys and other critical cybersecurity standards). Sensitive Data/Information Information (or data) that is highly sensitive and important, as classified by the entity, and intended for
      their use. One of the methods that can be used to classify this type of information is to measure the extent of damage when it is disclosed, accessed in an unauthorized manner, lost, or sabotaged,
      as this may result in material or moral damage to the entity or its clients, affecting the lives of persons associated with that information, or affecting and damaging the State security, national
      economy, or national capacities. Sensitive information includes all information whose unauthorized disclosure, loss, or sabotage results in accountability or statutory penalties. Confidentiality Maintaining
      authorized restrictions on access to and disclosure of information, including means of privacy/personal information protection. Critical National Infrastructure (CNI) Essential elements of infrastructure
      (i.e. assets, facilities, systems, networks, processes, and key personnel who operate and process them) whose loss or compromise may result in:  Significant negative impact on the availability, integration,
      or delivery of basic services, including services whose integrity could, if compromised, result in serious loss of property, lives, and/or injuries, taking into account significant national-level
      economic and/or social impacts.  Significant impact on national security, national defense, and/or State economy or national capacities. Cryptography It is also called (cryptology). It refers to
      rules that include the principles, methods, and means of storing and transmitting data or information in a particular form, in order to conceal its semantic content and prevent unauthorized use or
      prevent undetected modification, so that only the concerned persons can read and process them. Cyber-Attack An intentional attempt to impact cybersecurity negatively, whether successful or not. Cyber
      Risks Risks that harm the entity’s business operations (including the entity’s vision, mission, management, image, or reputation), assets, individuals, other entities, or the State due to unauthorized
      access, use, disclosure, disruption, modification, or damage of information and/or information systems. Cybersecurity Pursuant to the provisions of the NCA''s Statute issued by Royal Order No. 6801,
      dated 11/02/1439H., cybersecurity is the protection of networks, IT systems, operational technologies systems, their hardware and software components, services, and the data they contain, from any
      unauthorized penetration, disruption, modification, access, use, or exploitation.  The concept of cybersecurity also encompasses information security, digital security, and the like. Cybersecurity
      Resilience The overall ability of  entities to withstand cyber events and, where harm is caused, recover from them. Cyberspace The interconnected network of IT infrastructure, including the Internet,
      communication networks, computer systems, Internet-connected devices, and associated processors and control devices. The term can also refer to a virtual world or domain, such as experimental phenomenon
      or abstract concept. Data and Information Classification Determining the sensitivity level of data and information which gives rise to security controls for each classification level. Data and information
      sensitivity levels are set according to predefined categories, where data and information is created, modified, improved, stored, or transmitted. The classification level is an indicator of the value
      or significance of data and information to the entity. Data Archiving The process of transferring data that is no longer actively used to a separate storage device for long-term retention. Archive
      data consists of older data that is still important to the entity and may be needed for future reference, as well as data that shall be retained for legal and regulatory compliance purposes. Defense-in-Depth
      A concept of information assurance where multiple levels of security controls are used (as a defense) in the IT/OT system. Disaster Recovery Programs, activities, and plans designed to restore the
      entity’s critical business functions and services to an acceptable state, following exposure to cyber-attacks or disruption of such functions or services. Domain Name System (DNS) A technical system
      that uses a database distributed over the network and/or the Internet to allow the translation of domain names into IP addresses and vice versa, in order to identify service addresses, such as web
      and e-mail servers. Effectiveness A degree whereby a planned impact is achieved. Planned activities are considered effective if they are already implemented, and planned results are considered effective
      if they are already achieved. The Key Performance Indicators (KPIs) can be used to measure and evaluate the effectiveness level. Efficiency Relationship between the results achieved (outputs) and
      the resources used (inputs). The efficiency of a process or system can be enhanced by achieving more results using the same resources (inputs) or even less. Event An event related to the cybersecurity
      state of a network, a system, a service, data, or any other digital device. Hyper Text Transfer Protocol Secure (HTTPS) A protocol that uses encryption to secure the web pages and data when they are
      transmitted over the network. It is a secure version of the Hyper Text Transfer Protocol (HTTP). Identification A means for verifying the user’s identity, process, or device, which is usually a prerequisite
      for granting access to system resources. Incident An event that occurred and negatively impacted cybersecurity, whether intentional or unintentional. Integrity Protection against unauthorized modification
      or destruction of information, including ensuring information non-repudiation and reliability. International Requirements International requirements are those developed by an international entity
      or organization for regulatory use worldwide (e.g. SWIFT, PCI, etc.). Intrusion Prevention System (IPS) A system with intrusion detection capabilities, as well as capabilities to prevent and stop
      suspicious or potential activities and incidents. Key Performance Indicator (KPI) A type of performance measurement tools that evaluate the success of an activity or an entity in achieving specific
      objectives. Labeling Display of information (with specific and standard naming and coding) on the entity’s assets (such as devices, applications, documents, etc.) to refer to some information on the
      classification, ownership, and type of the asset and other asset management information. Least Privilege A basic principle in cybersecurity that aims at granting users only access privileges they
      need to fulfill their official responsibilities. Malware A program that infects systems, usually covertly, with the intent of compromising the confidentiality, integrity, accuracy, or availability
      of data, applications, or operating system. Multi-Factor Authentication (MFA) A security system that verifies user identity, using several authentication factors through authentication technique.
      Authentication factors are:  Knowledge (something only the user knows “like using password technique”).  Possession (something only owned by the user “such as using technique like a program, device
      generating random numbers or SMSs” for login records, which are called: One-Time-Password).  Inherent characteristics (characteristics of the user only, such as using fingerprint or face recognition
      techniques). Multi-tier Architecture An architecture or structure that applies a client-server approach in which the functional process logic, data access, data storage, and user interface are developed
      and maintained as separate units on separate platforms. Need-to-Know and Need-to-Use Restrictions on data, which is considered confidential, unless a person has a specific need to know for official
      business duties. Offline/Offsite Backup A backup of databases, and settings of systems, applications, and devices when the copy is offline and cannot be updated. Typically, backup tapes are utilized
      for offsite backup. Online Backup A storage method whereby the backup is regularly taken on a remote server over a network (either within the entity’s network or hosted by a service provider). Organization
      Staff Individuals who work for the entity (including official employees, temporary employees, and contractors). Outsourcing Obtaining goods or services by contracting with a supplier or a service
      provider. Patch Supporting data packages used to upgrade, fix, or improve computer operating system, software, or applications. This includes fixing security vulnerabilities and other bugs. Such patches
      are usually called fixes, bug fixes, and usability or performance improvements. Penetration Testing Testing a computer system, network, web application, or mobile application to find vulnerabilities
      that can be exploited by an attacker. Phishing Emails An attempt to obtain confidential information, such as usernames, passwords, or credit card details, often for malicious reasons and intentions,
      by disguising as a trustworthy entity in emails. Physical Security Physical security describes security measures designed to prevent unauthorized access to the entity’s facilities, equipment, and
      resources, and to protect individuals and property against damage or harm (such as espionage, theft, or terrorist attacks). Physical security involves the use of multiple tiers of interconnected systems,
      including CCTV, security guards, security limits, locks, access control systems, and many other technologies. Policy A document with clauses specifying a general obligation, direction, or intent as
      formally expressed by the Authorized Official of the entity . Cybersecurity policy is a document with clauses reflecting official commitment of the senior management of the entity to implement and
      improve the cybersecurity program within the entity. Such policy includes the entity’s objectives relating to the cybersecurity program, as well as its controls, requirements, and improvement and
      development mechanisms. Privileged Access Management The process of managing high-risk authorizations on the entity’s systems, which often need special handling to minimize risks that may arise from
      the misuse thereof. Procedure A document with a detailed description of the steps necessary to perform specific operations or activities in compliance with relevant standards and policies. Procedures
      are defined as part of operations. Process A set of interrelated or interactive activities that translates inputs into outputs. Such activities are influenced by the entity’s policies. Recovery A
      procedure or process to restore or control something that is suspended, damaged, stolen, or lost. Retention The time period during which information, data, event logs, or backups shall be retained,
      regardless of the form (e.g. paper, electronic, etc.). Secure Coding Standards A practice for the development of computer software and applications in a way that protects against exposure to cybersecurity
      vulnerabilities in software and applications. Secure Configuration and Hardening Protecting, hardening, and configuring the settings of computers, systems, applications, network devices, and security
      devices to resist cyber-attacks, such as disabling or changing manufacturing and default accounts, disabling unused services, and disabling unused network ports. Security Information and Event Management
      (SIEM) A system that manages and analyzes security event logs in real time, in order to monitor threats and analyze the results of interrelated rules for event logs and reports on logs data, and incident
      response. Security Testing A process intended to ensure that a modified or new system or application, has the appropriate security controls and protection, is free from any security vulnerabilities
      that might compromise other systems and applications or lead to misusing the system or application or information thereon, and to maintain the functionality of the system or application as intended.
      Security-by-Design A methodology for developing systems and software and designing networks to free them from cybersecurity vulnerabilities and weaknesses and make them impervious to cyber-attack
      as much as possible through several measures, such as continuous testing, authentication safeguards, and adherence to best programming and design practices. Segregation of Duties A key cybersecurity
      principle that aims at minimizing errors and fraud during the stages of processing specific tasks, by ensuring the presence of more than one individual to complete a task with different privileges.
      Sender Policy Framework A method to verify that the email server used for sending emails belongs to the sender''s domain. Third-Party Any entity that serves as a party to contractual relationship
      to provide goods or services (including suppliers and service providers). Threat Anything with the potential to impact cybersecurity negatively. Threat Intelligence It provides and analyzes organized
      information on recent, current, and potential attacks that could pose a cyber threat to the entity. Vulnerability A weakness in any information technology asset (such as software and systems) or a
      process, control, or anything, that could be exploited to negatively impact cybersecurity. Web Application Firewall A protection system that is installed before web applications to minimize risks
      that may arise from attack attempts against web applications. Zero-Day Malware Previously unknown malware that has been produced or disseminated recently and is normally hard to be detected by prior
      knowledge of malware (Signature-based Protection). Appendix (B): List of the Abbreviations Table (3) below shows some of the abbreviations and their meanings which are used in this document. TABLE
