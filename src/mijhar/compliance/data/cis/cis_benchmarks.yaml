# CIS Benchmarks — representative technical subset (mapping types direct/partial/supporting_evidence).
id: cis
name: CIS Benchmarks
version: Representative subset (Linux + macOS); verify against licensed benchmark
description: CIS Benchmarks provide prescriptive hardening recommendations. This subset maps MIJHAR automated checks to commonly referenced CIS section numbers.
mapping_note: Section numbers/titles are drawn from public CIS benchmark summaries; the full benchmark text is licensed by the Center for Internet Security and is not redistributed here. Verify exact section
  numbering against the specific OS benchmark version you assess against.
controls:
- id: 5.2.8
  title: Ensure SSH root login is disabled
  level: Level 1
  domain: Access, Authentication and Authorization
  verified: true
  mappings:
  - rule_id: SSH-001
    type: direct
    verified: true
    source: CIS Linux Benchmark — SSH Server Configuration
- id: 5.2.4
