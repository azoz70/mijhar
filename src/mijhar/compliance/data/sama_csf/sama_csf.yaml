# SAMA Cyber Security Framework (CSF)
# Source: Saudi Central Bank (SAMA) Rulebook — Cyber Risk Control chapter.
# Circular No. 381000091275 (24/5/2017), Status: In-Force.
# 4 domains, 32 subdomains, 6 maturity levels (0-5, min Level 3).
# Control considerations extracted from the Rulebook; hierarchical IDs are
# best-effort reconstructions and require verification against the official source.
id: sama-csf
name: SAMA Cyber Security Framework
version: CSF (SAMA Rulebook, Circular 381000091275)
description: Mandatory, principle-based cybersecurity framework issued by the Saudi Central Bank for regulated Member Organizations. 4 main domains, 32 subdomains, 6 maturity levels (0-5, min Level 3).
  Each subdomain states principles/objectives and numbered control considerations (up to 4 levels).
mapping_note: Subdomain names/numbers are from the SAMA Rulebook. Control-consideration text is extracted verbatim from the Rulebook; hierarchical IDs are reconstructed from the document's numbering and
  require verification against the official source. Rule-to-consideration links are interpretive and unverified.
