name: Security and quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project, Ruff and build tools
        run: python -m pip install -e ".[dev]" ruff build
      - name: Critical Python lint checks
        run: ruff check src tests --select E4,E7,E9,F63,F7,F82
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check installed dependency consistency
        run: python -m pip check

  security:
    name: Bandit and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and audit tools
        run: python -m pip install -e ".[dev]" bandit pip-audit
      - name: Python security static analysis
        run: bandit -r src -ll -q
      - name: Audit installed Python dependencies
        run: python -m pip_audit
